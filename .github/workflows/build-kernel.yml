name: Build TendouKei-v27.1.2
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git repo python3 curl zip unzip bc bison flex libssl-dev libelf-dev build-essential
          git config --global user.name "farrizdesignpro1339"
          git config --global user.email "farrizdesignpro1339@users.noreply.github.com"

      - name: Sync vanilla android13-5.15
        run: |
          mkdir kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          ls common/build.config.gki.aarch64

      - name: Inject Droid + KSUN 3.4.0 + SUSFS
        run: |
          cd kernel/common
          git clone https://github.com/ravindu644/Droidspaces-OSS.git --depth=1 droid-tmp
          ls droid-tmp/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/
          patch -p1 < droid-tmp/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          rm -rf droid-tmp

          # 2. KSUN 3.4.0 pin
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git -b v3.4.0 --depth=1 ksun-tmp
          mkdir -p drivers/kernelsu
          cp -r ksun-tmp/kernel/* drivers/kernelsu/
          echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          rm -rf ksun-tmp

          # 3. SUSFS latest
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 --depth=1 susfs
          cp susfs/kernel_patches/fs/susfs.c fs/
          cp susfs/kernel_patches/include/linux/susfs.h include/linux/
          cp susfs/kernel_patches/include/linux/susfs_variants.h include/linux/ 2>/dev/null || true
          patch -p1 --fuzz=3 < susfs/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch
          patch -p1 --fuzz=3 < susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          rm -rf susfs

      - name: Config gki_defconfig
        run: |
          cd kernel/common
          DEF=arch/arm64/configs/gki_defconfig
          set_conf() {
            if grep -q "# $1 is not set" $DEF; then sed -i "s/# $1 is not set/$1=y/" $DEF
            elif ! grep -q "^$1=" $DEF; then echo "$1=y" >> $DEF; fi
          }
          set_conf CONFIG_KSU
          set_conf CONFIG_KSU_SUSFS
          set_conf CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT
          set_conf CONFIG_KSU_SUSFS_SUS_PATH
          set_conf CONFIG_KSU_SUSFS_SUS_MOUNT
          set_conf CONFIG_KSU_SUSFS_SUS_KSTAT
          set_conf CONFIG_KSU_SUSFS_TRY_UMOUNT
          set_conf CONFIG_KSU_SUSFS_SPOOF_UNAME
          set_conf CONFIG_SYSVIPC
          set_conf CONFIG_POSIX_MQUEUE
          set_conf CONFIG_IPC_NS
          set_conf CONFIG_PID_NS
          set_conf CONFIG_DEVTMPFS
          set_conf CONFIG_USER_NS
          set_conf CONFIG_TMPFS_XATTR
          set_conf CONFIG_TMPFS_POSIX_ACL
          set_conf CONFIG_NETFILTER_XT_MATCH_ADDRTYPE
          set_conf CONFIG_IP_SET
          sed -i '/CONFIG_LOCALVERSION/d' $DEF
          echo 'CONFIG_LOCALVERSION="-TendouKei-v27.1.2-FarrizDesignPro-BlueArchive"' >> $DEF
          echo "-TendouKei-v27.1.2-FarrizDesignPro-BlueArchive" > localversion
          cat localversion

      - name: Build GKI
        run: |
          cd kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh -j$(nproc --all)
          ls -lh out/android13-5.15/dist/

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1
          cp kernel/out/android13-5.15/dist/Image AnyKernel3/
          sed -i 's/kernel.string=.*/kernel.string=TendouKei-v27.1.2 by FarrizDesignPro BlueArchive KSUN-3.4.0 SUSFS DROID/' AnyKernel3/anykernel.sh
          cd AnyKernel3
          zip -r9 ../TendouKei-v27.1.2-FarrizDesignPro-BlueArchive.zip * -x .git*
          cd ..
          ls -lh *.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TendouKei-v27.1.2-FarrizDesignPro-BlueArchive
          path: "*.zip"

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: TendouKei-v27.1.2-${{ github.run_number }}
          name: TendouKei-v27.1.2-FarrizDesignPro-BlueArchive
          body: |
            **TendouKei-v27.1.2-FarrizDesignPro-BlueArchive**
            - Base: vanilla common-android13-5.15
            - KSUN 3.4.0 + SUSFS latest
            - Droidspaces kABI support
            - uname: 5.15-TendouKei-v27.1.2-FarrizDesignPro-BlueArchive
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
