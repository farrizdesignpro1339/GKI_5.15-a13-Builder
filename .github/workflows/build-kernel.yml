name: Build TendouKei-bootimg
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git repo python3 curl zip unzip bc bison flex libssl-dev libelf-dev build-essential
          git config --global user.name "farrizdesignpro1339"
          git config --global user.email "farrizdesignpro1339@users.noreply.github.com"

      - name: swap 25G (anti OOM 137)
        run: |
          sudo fallocate -l 25G /swapfile
          sudo chmod 600 /swapfile; sudo mkswap /swapfile; sudo swapon /swapfile
          free -h | head -n 2
          df -h / | tail -n 1

      - name: Sync vanilla android13-5.15
        run: |
          mkdir kernel && cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15 --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          ls common/build.config.gki.aarch64

      - name: Inject Droid + KSUN pershoot dev-susfs + SUSFS (tanpa 10_enable!)
        run: |
          cd kernel/common
          git clone https://github.com/ravindu644/Droidspaces-OSS.git --depth=1 droid-tmp
          patch -p1 < droid-tmp/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
          rm -rf droid-tmp
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 --depth=1 susfs
          cp susfs/kernel_patches/fs/susfs.c fs/
          cp susfs/kernel_patches/include/linux/* include/linux/
          patch -p1 --fuzz=3 < susfs/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch || true
          grep -q "susfs_def.h" fs/namespace.c || sed -i '/#include <linux\/mnt_idmapping.h>/a #ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#endif' fs/namespace.c
          grep -q "susfs_def.h" fs/proc/task_mmu.c || sed -i '/#include <linux\/pkeys.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif' fs/proc/task_mmu.c
          rm -rf susfs

      - name: Config via POST_DEFCONFIG
        run: |
          cd kernel/common
          git checkout -- arch/arm64/configs/gki_defconfig
          echo "-TendouKei-v27.1.2" > localversion
          cat >> ../build.config.gki.aarch64 <<'EOF'
          POST_DEFCONFIG_CMDS="update_extra_config"
          update_extra_config() {
            echo "CONFIG_KSU=y" >> ${OUT_DIR}/.config
            echo "CONFIG_KSU_SUSFS=y" >> ${OUT_DIR}/.config
            echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ${OUT_DIR}/.config
            echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ${OUT_DIR}/.config
            echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ${OUT_DIR}/.config
            echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ${OUT_DIR}/.config
            echo "CONFIG_SYSVIPC=y" >> ${OUT_DIR}/.config
            echo "CONFIG_POSIX_MQUEUE=y" >> ${OUT_DIR}/.config
            echo "CONFIG_IPC_NS=y" >> ${OUT_DIR}/.config
            echo "CONFIG_PID_NS=y" >> ${OUT_DIR}/.config
            echo "CONFIG_DEVTMPFS=y" >> ${OUT_DIR}/.config
            echo "CONFIG_USER_NS=y" >> ${OUT_DIR}/.config
            echo "CONFIG_TMPFS_XATTR=y" >> ${OUT_DIR}/.config
            echo "CONFIG_TMPFS_POSIX_ACL=y" >> ${OUT_DIR}/.config
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> ${OUT_DIR}/.config
            echo "CONFIG_IP_SET=y" >> ${OUT_DIR}/.config
            (cd ${OUT_DIR} && make O=${OUT_DIR} olddefconfig)
          }
          EOF

      - name: Build GKI serial (anti OOM)
        env:
          MAKE_JOBS: 1
          LLVM_PARALLEL_LINK_JOBS: 1
        run: |
          cd kernel
          BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh
          ls -lh out/android13-5.15/dist/

      - name: Upload boot.img + Image langsung (tanpa AnyKernel)
        uses: actions/upload-artifact@v4
        with:
          name: TendouKei-bootimg
          if-no-files-found: warn
          path: |
            kernel/out/android13-5.15/dist/boot.img
            kernel/out/android13-5.15/dist/Image*
            kernel/out/android13-5.15/dist/System.map

      - name: Upload to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: TendouKei-bootimg-${{ github.run_number }}
          name: TendouKei-bootimg
          body: |
            **TendouKei boot.img langsung (tanpa AnyKernel)**
            - Base: vanilla common-android13-5.15
            - KSUN pershoot dev-susfs + SUSFS
          files: |
            kernel/out/android13-5.15/dist/boot.img
            kernel/out/android13-5.15/dist/Image.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
